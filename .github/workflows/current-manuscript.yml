name: Current manuscript package
on:
  push:
    paths: ['papers/**', 'scripts/verify_current_package.py']
  pull_request:
    paths: ['papers/**', 'scripts/verify_current_package.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_current_package.py
