name: Publish current manuscript files
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed current manuscript tag'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/verify_current_package.py
      - name: Create a reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" papers/* --target "$GITHUB_SHA" --title "$TAG" --notes-file RELEASE-NOTES.md
