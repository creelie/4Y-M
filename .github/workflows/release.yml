name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.0.0"
        required: true
      title:
        description: "Release title"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes "Papers: tex/main.tex (main.pdf), strong-coupling/prd/main.tex (preprintYangMillsDobrushinCeiling/YangMillsDobrushinCeiling.pdf) and strong-coupling/forest/main.tex (preprintYangMillsForestGauge/YangMillsForestGauge.pdf). Lean 4/Mathlib certificate in YangMills/ (lake build; no sorry, standard axioms only). Authors: Deep Bhattacharjee (ORCID 0000-0003-0466-750X; itsdeep@live.com, d.bhattacharjee@erl-forschung.de), Ushashi Bhattacharya."
